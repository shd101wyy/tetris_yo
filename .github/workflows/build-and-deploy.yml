name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Yo is installed from GITHUB RELEASES, not npm. npm publishing stopped at
      # v0.2.0, so `npm install -g @shd101wyy/yo` pulls a v0.2.0-era compiler;
      # it then honours `.yo-version` by trying to DISPATCH to the pinned
      # release through npm and dies with
      #   Error dispatching to Yo v0.2.32: HTTP 404 fetching
      #   https://registry.npmjs.org/%40shd101wyy%2Fyo/0.2.32
      # The version is pinned to match `.yo-version`, so the installed compiler
      # IS the one the project asks for and no dispatch happens at all.
      - name: Install Yo compiler
        run: |
          curl -sSL https://shd101wyy.github.io/Yo/install.sh | sh -s -- --version "$(cat .yo-version)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show Yo version
        run: yo --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.64"

      - name: Build raylib for Emscripten
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git raylib-wasm-build
          cd raylib-wasm-build
          emcmake cmake -B build -G Ninja -DPLATFORM=Web -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF
          emmake ninja -C build
          emmake ninja -C build install
          cd ..
          rm -rf raylib-wasm-build
          # emcc installs to sysroot/lib/ but searches sysroot/lib/wasm32-emscripten/
          SYSROOT=$(em-config CACHE)/sysroot
          cp "$SYSROOT/lib/libraylib.a" "$SYSROOT/lib/wasm32-emscripten/libraylib.a" 2>/dev/null || true

      # `yo fetch` was removed with the dependency-system redesign. Dependencies
      # are declared in yo.toml and pinned in yo.lock; `--locked` makes the
      # committed lock authoritative, so a resolution that would change it fails
      # here rather than drifting. (`yo build` would fetch on its own, but being
      # explicit keeps the lock honest.)
      - name: Fetch dependencies
        run: yo install --locked

      - name: Build WASM target
        run: yo build install_wasm

      - name: Prepare Pages artifact
        run: cp yo-out/wasm32-unknown-emscripten/bin/tetris_yo_wasm.html yo-out/wasm32-unknown-emscripten/bin/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: yo-out/wasm32-unknown-emscripten/bin

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
